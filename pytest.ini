[pytest]
markers =
    smoke_tests: toy examples that check callable functionality, dependency wiring, and main code paths.
    consistency_checks: structural checks of input, output, and internal data contracts.
    regression_tests: artifact-based comparisons against validated reference outputs.
    regression_fast: small artifact-based regression tests suitable for routine development.
    regression_slow: larger artifact-based regression tests for release validation.
    benchmarks: timing and performance checks, separate from correctness tests.
